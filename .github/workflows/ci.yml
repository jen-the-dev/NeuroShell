name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build NeuroShell
        run: |
          xcodebuild \
            -project NeuroShell.xcodeproj \
            -scheme NeuroShell \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
