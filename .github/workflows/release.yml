name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build NeuroShell.app
        run: |
          xcodebuild \
            -project NeuroShell.xcodeproj \
            -scheme NeuroShell \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package release artifact
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent NeuroShell.app NeuroShell-macOS.zip

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/NeuroShell-macOS.zip
          generate_release_notes: true
